name: Build and Push Docker images

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and push hanxi/cups-web
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push hanxi/cups-web (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # 镜像 tag / VERSION：v* tag 推送用 tag 名（vX.Y.Z）并追加 latest；
          # master 分支推送统一用 dev——不能拿分支名当 tag 名，
          # "master" 镜像 tag 会与 master 分支/标签引用重名混淆。
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: |
            hanxi/cups-web:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}${{ github.ref_type == 'tag' && '
            hanxi/cups-web:latest' || '' }}
          cache-from: type=gha,scope=cups-web
          cache-to: type=gha,scope=cups-web,mode=max

  output:
    name: Output pushed image refs
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Output pushed image refs
        run: |
          echo "Pushed hanxi/cups-web:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}${{ github.ref_type == 'tag' && ' and hanxi/cups-web:latest' || '' }}"
