name: Build and Push Docker images

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    env:
      # Docker Hub 命名空间取自仓库 secret，不要写死具体账号名 ——
      # 一旦写死，别人 fork 出去的仓库会把镜像推到原作者的命名空间下。
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cups-web
    outputs:
      tags: ${{ steps.tags.outputs.value }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 登录 Docker Hub ────────────────────────────────────────────
      # 不用 docker/login-action，自己规范化后再走 --password-stdin：
      #   - 在管理界面粘贴 secret 时很容易带进看不见的换行/空格，而 GitHub
      #     不会 trim。空白混进 Basic 认证头会让 docker 报
      #     「malformed HTTP Authorization header」—— 那句话不指向根因，
      #     会让人以为是 token 本身坏了。
      #   - --password-stdin 也避免口令出现在进程列表里。
      # tr -d '[:space:]' 只去空白，不改动 token 的任何有效字符。
      - name: Login to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user=$(printf '%s' "$DH_USER" | tr -d '[:space:]')
          pass=$(printf '%s' "$DH_PASS" | tr -d '[:space:]')
          if [ -z "$user" ] || [ -z "$pass" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 为空，请检查仓库 Secrets"
            exit 1
          fi
          printf '%s' "$pass" | docker login --username "$user" --password-stdin

      # 镜像 tag / VERSION：v* tag 推送用 tag 名（vX.Y.Z）并追加 latest；
      # main 分支推送统一用 dev——不能拿分支名当 tag 名，
      # "main" 镜像 tag 会与 main 分支/标签引用重名混淆。
      #
      # ⚠️ 为什么单独用一步算 tag，而不是直接在 tags: 里拼：
      # 旧写法靠 YAML 块标量里的真实换行，把 "latest" 那一行接在 ${{ }} 的
      # 字符串字面量里。镜像名前缀改成 ${{ env.IMAGE_NAME }} 之后，那个字面量
      # 内部就出现了 }}，会提前终止外层 ${{ }} 的解析，整段变成语法错误。
      # 放到 shell 里拼就完全绕开了这个问题（逗号是 build-push-action 认可的
      # tag 分隔符）。
      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${IMAGE_NAME}:${{ github.ref_name }},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE_NAME}:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          # 分支构建（dev）只出 amd64：GitHub 的托管 runner 是 x86，arm64 /
          # armv7 要在 QEMU 里模拟，而本镜像还要源码编译 CUPS、apt 装
          # LibreOffice + Java + 整套打印驱动 —— 模拟下两三个架构跑一两个
          # 小时是常态，而 dev 是每次 push 都出的滚动包，不值得。
          # 正式 release（v* tag）才出三架构，与 README 承诺保持一致。
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=cups-web
          cache-to: type=gha,scope=cups-web,mode=max

  output:
    name: Output pushed image refs
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Output pushed image refs
        run: |
          echo "Pushed ${{ needs.build.outputs.tags }}"
