<!--
  微信支付品牌标识（图形来源：Simple Icons，该图形属腾讯所有，
  此处用于「用微信付款」的指示性用途）。品牌绿 #07C160。

  ⚠️ 与 alipay.svg 同一套约定，别改成引 CDN：这个程序部署在内网
  （典型是 192.168.x.x 的单容器），运行时根本取不到外网资源，线上会只剩
  一个破图 —— 而且是最需要它出现的收款页。

  ⚠️ 微信渠道目前【不可选】（后端 buildProvider("wechat") 返回
  ErrUnavailable，availableProviders 也有意不列它，见 cmd/server/payment.go）。
  所以这张图现在渲染不到任何界面上，是随「框架」一起备好的素材。
  等渠道真正开通时，它经由 utils/payProvider.js 的 PAY_LOGOS 自动生效，
  不需要再改这里的任何东西。
-->
