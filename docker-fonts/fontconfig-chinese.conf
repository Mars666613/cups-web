<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  中文字体别名。让 fontconfig 在有人要「宋体 / 黑体 / 楷体 / 仿宋」时，
  解析到这个镜像里【真实存在】的字体上。

  为什么需要它：LibreOffice 的 fallback 渲染路径是按字体【名字】去问
  fontconfig 的，而 WPS/Acrobat 导出的文档里写的正是「宋体」「黑体」这些
  中文名。没有这层别名，fontconfig 会随便挑一个装了的中文字体，
  四个字重全变成同一个，排版观感与原文差很远。

  ── 顺序是有意的 ──────────────────────────────────────────────
  每个 accept 列表里 Sim* 排在前面，开源字体排在后面。
  fontconfig 取的是列表里【第一个真正装了的】family，所以：

    用户自己放了 simsun.ttf 等字体 → 用他的（字形更接近原稿）
    没放（本仓库的默认状态）        → 落到开源字体上

  🚫 SimSun/SimHei/SimKai/FangSong 是微软/中易的版权字体，**不能随仓库公开
     分发**，所以仓库里没有它们。详见 docker-fonts/README.md。
-->
<fontconfig>
  <!-- 宋体 → SimSun / AR PL UMing -->
  <alias>
    <family>宋体</family>
    <accept>
      <family>SimSun</family>
      <family>AR PL UMing CN</family>
    </accept>
  </alias>
  <alias>
    <family>SimSun</family>
    <accept>
      <family>AR PL UMing CN</family>
    </accept>
  </alias>
  <alias>
    <family>NSimSun</family>
    <accept>
      <family>SimSun</family>
      <family>AR PL UMing CN</family>
    </accept>
  </alias>

  <!-- 黑体 → SimHei / 文泉驿正黑 -->
  <alias>
    <family>黑体</family>
    <accept>
      <family>SimHei</family>
      <family>WenQuanYi Zen Hei</family>
    </accept>
  </alias>

  <!-- 楷体 → KaiTi / AR PL UKai -->
  <alias>
    <family>楷体</family>
    <accept>
      <family>KaiTi</family>
      <family>SimKai</family>
      <family>AR PL UKai CN</family>
    </accept>
  </alias>

  <!--
    仿宋 → FangSong / 明体（退而求其次）
    开源中文字体里没有仿宋。仿宋与宋体同属衬线/明体一路，所以退到 UMing 比
    退到黑体接近得多。要真正的仿宋就自己放 simfang.ttf。
  -->
  <alias>
    <family>仿宋</family>
    <accept>
      <family>FangSong</family>
      <family>SimFang</family>
      <family>AR PL UMing CN</family>
    </accept>
  </alias>
</fontconfig>
